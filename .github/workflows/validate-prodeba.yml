name: Prodeba validation

on:
  push:
    branches: [main, "debug/**"]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate embedded JavaScript
        run: node scripts/validate-prodeba.mjs
